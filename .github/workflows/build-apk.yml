name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install & sync web code into Android
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/FitDad-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitDad-apk
          path: out/*.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FitDad build ${{ github.run_number }}
          body: Install FitDad-${{ github.run_number }}.apk on your Android phone.
          files: out/*.apk
          make_latest: true
