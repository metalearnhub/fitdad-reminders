name: Build Android APK

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install & sync web code into Android
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ github.ref_name }}" = "beta" ]; then ./gradlew assembleDebug -Pbeta --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Rename APK
        run: |
          mkdir -p out
          if [ "${{ github.ref_name }}" = "beta" ]; then NAME=UpkeepBeta; else NAME=Upkeep; fi
          echo "APK_NAME=$NAME-${{ github.run_number }}" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/app-debug.apk out/$NAME-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Upkeep-apk
          path: out/*.apk

      - name: Publish release (main)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Upkeep build ${{ github.run_number }}
          body: Install ${{ env.APK_NAME }}.apk on your Android phone.
          files: out/*.apk
          make_latest: true

      - name: Publish pre-release (beta)
        if: github.ref_name == 'beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Upkeep Beta ${{ github.run_number }}
          body: BETA — installs as a separate app ("Upkeep Beta") with its own data. Your main Upkeep app is not touched.
          files: out/*.apk
          prerelease: true
          make_latest: false
